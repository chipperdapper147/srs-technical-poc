<div id="root" style="padding:16px"></div>
<script>
const h = React.createElement;
const S = window.SRS;
const stack = (...children) => h("div", { style: { display: "grid", gap: "16px", maxWidth: "420px" } }, ...children);
const row = (...children) => h("div", { style: { display: "flex", flexWrap: "wrap", gap: "12px", alignItems: "center" } }, ...children);
ReactDOM.createRoot(document.getElementById("root")).render(
  stack(
    row(h(S.Button, null, "Check"), h(S.Button, { variant: "outline" }, "New course"), h(S.Button, { variant: "secondary" }, "Secondary"), h(S.Button, { variant: "ghost" }, "Ghost"), h(S.Button, { variant: "destructive" }, "Delete"), h(S.Button, { variant: "link" }, "Back to course")),
    row(h(S.Button, { size: "lg" }, "Learn new words (3)"), h(S.Button, { size: "sm" }, "Small"), h(S.Button, { size: "xs" }, "Extra small"), h(S.Button, { disabled: true }, "Import")),
  )
);
</script>
