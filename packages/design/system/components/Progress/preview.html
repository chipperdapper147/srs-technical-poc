<div id="root" style="padding:16px"></div>
<script>
const h = React.createElement;
const S = window.SRS;
const stack = (...children) => h("div", { style: { display: "grid", gap: "16px", maxWidth: "420px" } }, ...children);
ReactDOM.createRoot(document.getElementById("root")).render(
  stack(
    h(S.Progress, { value: 40, "aria-label": "Session progress" }),
    h("div", { style: { display: "grid", gap: "6px" } },
      h("div", { className: "flex justify-between text-sm" }, h("span", null, "1. Basics"), h("span", { className: "text-muted-foreground" }, "1 / 3")),
      h(S.Progress, { value: 33, "aria-label": "Basics progress" })),
  )
);
</script>
