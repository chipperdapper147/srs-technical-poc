name: Setup
description: pnpm, Node from .nvmrc, dependencies, and optionally Atlas
inputs:
  atlas:
    description: Install the Atlas CLI
    default: "false"
  oasdiff:
    description: Install oasdiff (the openapi-breaking check)
    default: "false"
  node-version:
    description: Node version instead of .nvmrc (the nightly canary)
    default: ""
  latest:
    description: Upgrade every dependency to its latest version after installing (the nightly canary)
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc # node-version, when set, takes precedence
        cache: pnpm

    - name: Install Atlas
      if: inputs.atlas == 'true'
      shell: bash
      run: curl -sSf https://atlasgo.sh | sh -s -- --yes
      env:
        # Pinned: the installer's "latest" resolves to canary builds.
        # Keep in sync with README prerequisites.
        ATLAS_VERSION: v1.3.8

    - name: Install oasdiff
      if: inputs.oasdiff == 'true'
      shell: bash
      # Pinned; taken from the official image, as scripts/setup-agent-env.sh does.
      run: |
        cid="$(docker create tufin/oasdiff:v1.34.1)"
        sudo docker cp "$cid:/usr/bin/oasdiff" /usr/local/bin/oasdiff
        docker rm "$cid" >/dev/null
        oasdiff --version

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Upgrade every dependency to latest (at least 3 days old)
      if: inputs.latest == 'true'
      shell: bash
      env:
        # Skip releases under 3 days old (minutes): a just-published tarball
        # can 404 on npm for a while, and broken or hijacked releases are
        # usually pulled or patched within days.
        npm_config_minimum_release_age: "4320"
      run: pnpm up --recursive --latest && git diff --stat -- '**/package.json'
