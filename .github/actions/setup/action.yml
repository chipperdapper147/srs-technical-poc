name: Setup
description: pnpm, Node from .nvmrc, dependencies, and optionally Atlas
inputs:
  atlas:
    description: Install the Atlas CLI
    default: "false"
  node-version:
    description: Node version instead of .nvmrc (the nightly canary)
    default: ""
  latest:
    description: Upgrade every dependency to its latest version after installing (the nightly canary)
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc # node-version, when set, takes precedence
        cache: pnpm

    - name: Install Atlas
      if: inputs.atlas == 'true'
      shell: bash
      run: curl -sSf https://atlasgo.sh | sh -s -- --yes
      env:
        # Pinned: the installer's "latest" resolves to canary builds.
        # Keep in sync with README prerequisites.
        ATLAS_VERSION: v1.3.8

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Upgrade every dependency to latest
      if: inputs.latest == 'true'
      shell: bash
      run: pnpm up --recursive --latest && git diff --stat -- '**/package.json'
