name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: srs
          POSTGRES_PASSWORD: srs
          POSTGRES_DB: srs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U srs -d srs"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://srs:srs@localhost:5432/srs?sslmode=disable
      TEST_DATABASE_URL: postgres://srs:srs@localhost:5432/srs_test?sslmode=disable
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Atlas
        run: curl -sSf https://atlasgo.sh | sh -s -- --yes
        env:
          # Pinned: the installer's "latest" resolves to canary builds.
          # Keep in sync with README prerequisites.
          ATLAS_VERSION: v1.3.8

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Migrations valid and in sync with db/schema.sql
        run: pnpm db:check

      - name: Apply migrations
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE srs_test"
          pnpm db:migrate

      - name: Kysely types match the migrated schema
        run: |
          pnpm db:codegen
          git diff --exit-code apps/api/src/db/types.ts

      - run: pnpm typecheck

      - run: pnpm test

      - name: Seed runs cleanly
        run: pnpm db:seed

      - run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @app/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests (production build, real API and Postgres)
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
