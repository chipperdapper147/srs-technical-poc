# Verification stage 3 (docs/verification.md). Every job runs checks through
# `pnpm verify`, so CI and local runs share one definition of each check
# (scripts/verify/rules.ts). `check` is the single required status check:
# jobs can be split or renamed without touching branch protection.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited`: re-check after the title or description changes (pr-description).
    # The whole run repeats so `check` always reflects every job on this commit.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://srs:srs@localhost:5432/srs?sslmode=disable
  TEST_DATABASE_URL: postgres://srs:srs@localhost:5432/srs_test?sslmode=disable
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # check the whole history, not just the tip

      - name: No Claude session links in commit messages
        run: ./scripts/check-commit-messages.sh

  pr-description:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No Claude session links in the PR title or description
        env:
          # Passed as data; never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/check-pr-description.sh

  obligations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }} # the branch, not the merge commit
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # Node only: no pnpm here, so don't let setup-node look for its cache.
          package-manager-cache: false

      - name: Behaviour changes come with tests (or a waiver); owed evidence is ticked
        env:
          # Waivers and evidence boxes in the description. Passed as data; never
          # interpolated into the script.
          VERIFY_PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/verify/cli.ts obligations --committed --base "origin/$GITHUB_BASE_REF"

  static:
    runs-on: ubuntu-latest
    env:
      # openapi-breaking compares the spec with the base branch's copy.
      VERIFY_BASE: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base branch, for openapi-breaking
      - uses: ./.github/actions/setup
        with:
          oasdiff: "true"
      - name: Lint, types, unit tests, generated-file drift, API breaking changes
        run: >-
          pnpm verify --all
          --only lint,typecheck,test:scripts,release-age,rules-drift,shell-syntax,openapi-drift,openapi-breaking,design-drift,test:shared,test:design,test:client,test:web

  database:
    runs-on: ubuntu-latest
    services:
      postgres: &postgres
        image: postgres:18
        env:
          POSTGRES_USER: srs
          POSTGRES_PASSWORD: srs
          POSTGRES_DB: srs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U srs -d srs"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # migration-lint and migration-rehearsal judge the migrations this change
      # adds relative to its base branch (on main itself: nothing new).
      VERIFY_BASE: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base branch, for what this change adds
      - uses: ./.github/actions/setup
        with:
          atlas: "true"
      - run: psql "$DATABASE_URL" -c "CREATE DATABASE srs_test"
      - name: Schema, migration lint and rehearsal, old API on the new schema, codegen drift, API integration tests, seed
        run: >-
          pnpm verify --all
          --only db:check,migration-lint,codegen-drift,migration-rehearsal,compat-old-api,test:api,db:seed

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres: *postgres
    env:
      # compat-old-client runs the base branch's web app and specs.
      VERIFY_BASE: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base branch, for compat-old-client
      - uses: ./.github/actions/setup
        with:
          atlas: "true"
      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Install Playwright browser
        run: ./scripts/install-browsers.sh chromium

      - name: Production build, design-system previews, e2e (real API and Postgres), then the base web app against this API
        run: pnpm verify --all --only build:web,design-system,e2e,compat-old-client

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  check:
    if: always()
    needs: [commit-messages, pr-description, obligations, static, database, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All verification jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ] && [ "$r" != skipped ]; then exit 1; fi
          done
