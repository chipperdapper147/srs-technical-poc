# Verification stage 6 (docs/verification.md): what is too slow, too noisy or
# too forward-looking for every pull request. Not a required check; a failed
# run is reported by GitHub to whoever last changed the schedule.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC
  workflow_dispatch:
  # A change to this workflow runs it on its own PR, so it is verified before
  # the schedule depends on it.
  pull_request:
    paths: [.github/workflows/nightly.yml, .github/actions/setup/action.yml]

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://srs:srs@localhost:5432/srs?sslmode=disable
  TEST_DATABASE_URL: postgres://srs:srs@localhost:5432/srs_test?sslmode=disable
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # The e2e suite on the browsers PRs don't run yet.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox
            browser: firefox
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: srs
          POSTGRES_PASSWORD: srs
          POSTGRES_DB: srs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U srs -d srs"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_ALL_BROWSERS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          atlas: "true"
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm --filter @app/e2e exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @app/web build
      - name: e2e on ${{ matrix.project }}
        run: pnpm --filter @app/e2e exec playwright test --trace off --project ${{ matrix.project }} probe --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/e2e/playwright-report
          retention-days: 7
