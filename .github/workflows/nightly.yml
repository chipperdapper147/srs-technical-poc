# Verification stage 6 (docs/verification.md): what is too slow, too noisy or
# too forward-looking for every pull request. Not a required check; a failed
# run is reported by GitHub to whoever last changed the schedule.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC
  workflow_dispatch:
  # A change to this workflow runs it on its own PR, so it is verified before
  # the schedule depends on it.
  pull_request:
    paths: [.github/workflows/nightly.yml, .github/actions/setup/action.yml]

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://srs:srs@localhost:5432/srs?sslmode=disable
  TEST_DATABASE_URL: postgres://srs:srs@localhost:5432/srs_test?sslmode=disable
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Each e2e test 20 times, no retries: a test that fails once in 20 is flaky.
  flake-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres: &postgres
        image: postgres:18
        env:
          POSTGRES_USER: srs
          POSTGRES_PASSWORD: srs
          POSTGRES_DB: srs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U srs -d srs"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          atlas: "true"
      - run: pnpm db:migrate && pnpm db:seed
      - run: ./scripts/install-browsers.sh chromium
      - run: pnpm --filter @app/web build
      - name: Every e2e test, 20 times
        run: pnpm --filter @app/e2e exec playwright test --trace off --project chromium --repeat-each 20 --retries 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-flake-hunt
          path: apps/e2e/playwright-report
          retention-days: 7

  # The e2e suite on the browsers PRs don't run yet.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit
    services:
      postgres: *postgres
    env:
      E2E_ALL_BROWSERS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          atlas: "true"
      - run: pnpm db:migrate && pnpm db:seed
      - run: ./scripts/install-browsers.sh ${{ matrix.browser }}
      - run: pnpm --filter @app/web build
      - name: e2e on ${{ matrix.project }}
        run: pnpm --filter @app/e2e exec playwright test --trace off --project ${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/e2e/playwright-report
          retention-days: 7

  # Known advisories at low and moderate severity are listed in TODO.md.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: No high or critical advisories in the dependency tree
        run: pnpm audit --audit-level high

  # Upcoming versions: Node 26 and every dependency at its latest release at
  # least 14 days old (TypeScript 7 among them). An early warning, not a target
  # to keep green at any cost: a failure here is a TODO, not a broken build.
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # It runs third-party code nobody has pinned: no token permissions, no
    # saved credentials, no shared cache, and never any secrets.
    permissions: {}
    services:
      postgres: *postgres
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          atlas: "true"
          node-version: "26"
          latest: "true"
          cache: ""
      - run: node --version && pnpm exec tsc --version
      - run: psql "$DATABASE_URL" -c "CREATE DATABASE srs_test"
      - name: Lint, types, unit and integration tests, production build
        run: >-
          pnpm verify --all
          --only lint,typecheck,test:scripts,test:shared,test:design,test:client,test:web,test:api,build:web
